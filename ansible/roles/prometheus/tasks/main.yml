- name: Install Prometheus
  apt:
    name: prometheus
    state: present

- name: Configure Prometheus
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
  notify:
    - restart prometheus

- name: Ensure Prometheus is running
  systemd:
    name: prometheus
    enabled: yes
    state: started

- name: Wait for Prometheus to be available
  uri:
    url: http://localhost:9090/-/ready
    status_code: 200
  register: prom_health
  retries: 10
  delay: 5
  until: prom_health.status == 200
